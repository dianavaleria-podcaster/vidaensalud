<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redireccionando...</title>
    <link rel="canonical" href="https://dianavaleria.es/podcast/">
    <script>
        var path = window.location.pathname.replace(/^\/vidaensalud\.es/, '');

        if (path.includes('dinamica-y-orden-vida')) {
            var newPath = path.replace('dinamica-y-orden-vida', 'geometria-de-la-vida');
            window.location.replace("https://dianavaleria.es" + newPath);
        } else if (path.includes('tratado/volumen-1/confirmacion.html')) {
            window.location.replace("https://dianavaleria.es/libro/geometria-de-la-vida/entrega-1/umbral.html");
        } else if (path.startsWith('/libro/')) {
            window.location.replace("https://dianavaleria.es" + path);
        } else if (path.startsWith('/podcast/')) {
            window.location.replace("https://dianavaleria.es" + path);
        } else if (path.startsWith('/episodios/')) {
            window.location.replace("https://dianavaleria.es/podcast/" + path.replace(/^\/episodios\//, ''));
        } else if (path === '/' || path === '/index.html') {
            window.location.replace("https://dianavaleria.es/podcast/");
        } else {
            window.location.replace("https://dianavaleria.es/podcast" + (path.startsWith('/') ? path : '/' + path));
        }
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0; url=https://dianavaleria.es/podcast/">
    </noscript>
</head>
<body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 50px;">
        Redireccionando a <a href="https://dianavaleria.es/podcast/">dianavaleria.es/podcast</a>...
    </p>
</body>
</html>
